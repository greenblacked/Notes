# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Site configuration for Notes. Only deviations from upstream's quartz.config.default.yaml are
# commented. baseUrl comes from the NOTES_BASE_URL environment variable (see quartz.ts).
configuration:
  pageTitle: "Notes"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # No analytics and no third-party trackers.
  analytics: null
  locale: en-US
  # Overridden at build time from NOTES_BASE_URL (default: notes.szolotov.com).
  baseUrl: notes.szolotov.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  defaultDateType: modified
  theme:
    # "local": do not link to Google Fonts. The fonts are self-hosted: @fontsource woff2 files are
    # copied to /static/fonts by scripts/postprocess-build.mjs and declared in
    # quartz/styles/custom.scss (which also sets the article prose font, Literata). The names
    # below fall back to the system font stacks defined in quartz/util/theme.ts.
    fontOrigin: local
    cdnCaching: false
    typography:
      header: IBM Plex Sans Condensed
      body: IBM Plex Sans
      code: IBM Plex Mono
    # Mapping: light = page background, lightgray = borders, gray = muted text, darkgray = body
    # text, dark = headings, secondary = accent and links, tertiary = link hover. Surfaces and the
    # status colours are CSS variables in quartz/styles/custom.scss; scripts/check-contrast.mjs
    # checks both files.
    colors:
      lightMode:
        light: "#f4f6f8"
        lightgray: "#d3d9e1"
        gray: "#566172"
        darkgray: "#1b2330"
        dark: "#111823"
        secondary: "#1b66db"
        tertiary: "#1450ad"
        highlight: rgba(27, 102, 219, 0.05)
        textHighlight: "#ffe56688"
      darkMode:
        light: "#11151a"
        lightgray: "#2a323d"
        gray: "#9aa5b4"
        darkgray: "#d9dee5"
        dark: "#eef2f6"
        secondary: "#5a9cff"
        tertiary: "#8dbbff"
        highlight: rgba(90, 156, 255, 0.14)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      # The high-contrast themes keep every token above WCAG AA on the code surface.
      theme:
        light: github-light-high-contrast
        dark: github-dark-high-contrast
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    # Upstream's default config omits the layout entry, so no ToC component is rendered without it.
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Reading time is shown by the metadata strip (note-meta), so only the date stays here.
  - source: github:quartz-community/content-meta
    enabled: true
    options:
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}
  # Home page only (condition `home`). quartz.ts registers the component, because the pinned plugin
  # does not declare it in its manifest, and adds the filter that leaves out section index pages
  # and the tags page. Sorted by defaultDateType (modified).
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Recently updated
      limit: 5
      showTags: true
    layout:
      position: afterBody
      priority: 10
      condition: home
  # Local plugins (local-plugins/). The components are registered in quartz.ts, like recent-notes.
  # Metadata strip above the title, from the type, status, verified and decided frontmatter.
  - source: ./local-plugins/note-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 8
  # Anchor-link tabs for the h2 sections, under the title; desktop only.
  - source: ./local-plugins/section-tabs
    enabled: true
    layout:
      position: beforeBody
      priority: 12
      display: desktop-only
  # Markdown footnotes become margin sidenotes from 1200px up (see custom.scss).
  - source: ./local-plugins/sidenotes
    enabled: true
    order: 95
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: false
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/encrypted-pages
    enabled: false
    options:
      visibility: icon
      iterations: 600000
      passwordField: password
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}

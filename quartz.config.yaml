# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Site configuration for Notes. Only deviations from upstream's quartz.config.default.yaml are
# commented. baseUrl comes from the NOTES_BASE_URL environment variable (see quartz.ts).
configuration:
  pageTitle: "Notes"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # No analytics and no third-party trackers.
  analytics: null
  locale: en-US
  # Overridden at build time from NOTES_BASE_URL (default: notes.szolotov.com).
  baseUrl: notes.szolotov.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  defaultDateType: modified
  theme:
    # "local": do not link to Google Fonts. The fonts are self-hosted: @fontsource woff2 files are
    # copied to /static/fonts by scripts/postprocess-build.mjs and declared in
    # quartz/styles/custom.scss. Source Serif 4 sets the reading text and headings, IBM Plex Mono
    # the code; the names below fall back to the system font stacks defined in
    # quartz/util/theme.ts. Inter, for the interface (top bar, labels, chips, table of contents),
    # has no key here: it is the --ui variable in custom.scss.
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Source Serif 4
      body: Source Serif 4
      code: IBM Plex Mono
    # Mapping: light = the sheet of paper (article, popovers, inputs), lightgray = rules, gray =
    # muted text, darkgray = body text, dark = headings and ink, secondary = accent and links,
    # tertiary = link hover. The desk behind the sheet, the tints and the status colours are CSS
    # variables in quartz/styles/custom.scss; scripts/check-contrast.mjs checks both files.
    colors:
      lightMode:
        light: "#faf6ee"
        lightgray: "#d8cfbd"
        gray: "#5c5345"
        darkgray: "#2a251e"
        dark: "#1f1b16"
        secondary: "#8a2a1a"
        tertiary: "#6b1f12"
        highlight: rgba(138, 42, 26, 0.07)
        textHighlight: "#f2d36b88"
      darkMode:
        light: "#1c1712"
        lightgray: "#3a332a"
        gray: "#aca08b"
        darkgray: "#ddd5c4"
        dark: "#eee7d8"
        secondary: "#e8a283"
        tertiary: "#f2c1a9"
        highlight: rgba(232, 162, 131, 0.13)
        textHighlight: "#b3830488"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      # The high-contrast themes keep every token above WCAG AA on the code surface.
      theme:
        light: github-light-high-contrast
        dark: github-dark-high-contrast
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    # Upstream's default config omits the layout entry, so no ToC component is rendered without it.
    layout:
      position: right
      priority: 5
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # Before the toolbar group (priority 35), so that the keyboard meets Browse, search and the theme
  # toggle in the order they are drawn.
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 25
  # Replaced by local-plugins/graph (full graph, every page) and local-plugins/note-graph (local
  # graph at the end of a note)
  - source: github:quartz-community/graph
    enabled: false
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  # Replaced by local-plugins/linked-from, which has its own heading.
  - source: github:quartz-community/backlinks
    enabled: false
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # The spec sheet (note-meta) shows reading time and the modified date; this date is the fallback
  # for pages without one (home, section indexes, tags).
  - source: github:quartz-community/content-meta
    enabled: true
    options:
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # The wordmark is part of the top bar (local-plugins/top-bar), the section links of its second row
  # (local-plugins/section-row).
  - source: github:quartz-community/page-title
    enabled: false
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # The note is one centred column with nothing to hide, so there is no reader mode.
  - source: github:quartz-community/reader-mode
    enabled: false
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}
  # Local plugins (local-plugins/). The components are registered in quartz.ts.
  # Spec sheet under the title, from the type, status, verified and decided frontmatter.
  - source: ./local-plugins/note-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 12
  # Index of every note, grouped by section: the body of the home page (condition `home`).
  - source: ./local-plugins/note-index
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: home
  # The sticky top bar: the wordmark. The page frame's left sidebar is the bar, and holds this
  # component, the Explorer (its Browse button opens the drawer), the search and the dark-mode
  # toggle (see custom.scss).
  - source: ./local-plugins/top-bar
    enabled: true
    layout:
      position: left
      priority: 10
  # The second row of the bar: the section links. After the toolbar group (35), so the keyboard
  # order matches what is drawn.
  - source: ./local-plugins/section-row
    enabled: true
    layout:
      position: left
      priority: 40
  # The target of the skip link, before the breadcrumbs and the title.
  - source: ./local-plugins/content-start
    enabled: true
    layout:
      position: beforeBody
      priority: 1
  # "Linked from": the notes that link here, at the end of the note.
  - source: ./local-plugins/linked-from
    enabled: true
    layout:
      position: afterBody
      priority: 15
  # The full graph of all notes: a toolbar button and a dialog, on every page type.
  - source: ./local-plugins/graph
    enabled: true
    layout:
      position: left
      priority: 25
      group: toolbar
  # The local graph closes the note, below "Linked from".
  - source: ./local-plugins/note-graph
    enabled: true
    layout:
      position: afterBody
      priority: 20
  # Markdown footnotes become margin sidenotes from 1280px up (see custom.scss).
  - source: ./local-plugins/sidenotes
    enabled: true
    order: 95
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
  - source: github:quartz-community/bases-page
    enabled: false
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/encrypted-pages
    enabled: false
    options:
      visibility: icon
      iterations: 600000
      passwordField: password
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    # The top bar (left) stays on every page type; section and tag pages have no table of contents
    # and no graph. The 404 page is built for the minimal frame (no sidebars); the default frame
    # brings the bar back.
    "404":
      template: default
      positions:
        beforeBody: []
        afterBody: []
        right: []
    content: {}
    folder:
      positions:
        right: []
        afterBody: []
    tag:
      positions:
        right: []
        afterBody: []
    canvas: {}
    bases: {}

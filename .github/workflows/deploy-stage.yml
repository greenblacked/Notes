name: Deploy stage

# Every merge into main ships to stage.notes.szolotov.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to stage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: stage
      url: https://stage.notes.szolotov.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in deploy jobs: a cache written by another
          # workflow must not be able to change what ships.
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Build
        env:
          DEPLOY_ENV: stage
          STRICT_LINKS: '1'
        run: npm run build

      - name: Deploy, smoke test, roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          scripts/deploy.sh stage "$GITHUB_SHA" "stage ${GITHUB_SHA:0:12} (run ${GITHUB_RUN_ID})"

name: Deploy stage

# Every push to main updates the Worker Preview `stage` of the Worker `notes`, served at
# https://stage.notes.szolotov.com (see docs/deployment.md#stage-preview). Production is not
# touched: Previews never change production traffic.
#
# Two jobs: `build` runs the (third-party plugin) build code with no secrets and
# no environment; `upload` has the secrets, installs dependencies without
# lifecycle scripts, and only receives the build output as an artifact.
#
# Gating: instead of a workflow_run trigger (a dangerous trigger in zizmor), the
# checks run inline here against the exact commit being deployed.
on:
  push:
    branches: [main]

permissions: {}

# Runs queue (never cancel a deploy in flight); GitHub supersedes older pending
# runs, so only the newest queued commit waits.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # A cold `quartz plugin restore` (no cache here on purpose) takes about 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      current: ${{ steps.fresh.outputs.current }}
    env:
      SHA: ${{ github.sha }}
      # Neither our dependencies nor the plugins' (npm-installed by `quartz plugin restore`) may
      # run install scripts next to this job's checkout; the build needs none of them.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check this commit is still the head of main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/is-main-head.sh

      - name: Set up Node.js
        if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      - name: Install dependencies
        if: steps.fresh.outputs.current == 'true'
        run: npm ci

      - name: Type check
        if: steps.fresh.outputs.current == 'true'
        run: npm run check

      - name: Build
        if: steps.fresh.outputs.current == 'true'
        env:
          NOTES_BASE_URL: stage.notes.szolotov.com
          NOTES_SHA: ${{ github.sha }}
        run: npm run build

      - name: Check links
        if: steps.fresh.outputs.current == 'true'
        run: npm run check:links

      - name: Check the build output
        if: steps.fresh.outputs.current == 'true'
        run: node scripts/check-artifact.mjs --public public

      - name: Upload build output
        if: steps.fresh.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            public
            worker/csp.generated.js
          retention-days: 1
          if-no-files-found: error

  upload:
    name: Update stage Preview
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: staging
      url: https://stage.notes.szolotov.com
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      # No lifecycle scripts: nothing from the dependency tree runs next to the token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Only the two expected paths are accepted from the artifact (built by a job that ran
      # third-party code), and public/ must pass the extension allowlist (scripts/check-artifact.mjs).
      - name: Install build output
        run: |
          site="$RUNNER_TEMP/site"
          node scripts/check-artifact.mjs --root "$site"
          rm -rf public worker/csp.generated.js
          cp -R "$site/public" public
          cp "$site/worker/csp.generated.js" worker/csp.generated.js

      - name: Re-check this commit is still the head of main
        id: fresh
        run: .github/scripts/is-main-head.sh

      # `wrangler preview` creates or updates the Preview `stage`; its ENVIRONMENT var comes
      # from `previews.vars` in wrangler.jsonc. It does not touch production or the routes.
      - name: Update the stage Preview
        id: preview
        if: steps.fresh.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview.ndjson
        run: |
          npx wrangler preview --name stage --message "stage ${SHA::7}" --tag "$SHA"
          out="$(node scripts/read-wrangler-output.mjs --preview "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "$out"
          echo "$out" >>"$GITHUB_OUTPUT"

      - name: Require the custom domain Preview URL
        if: steps.fresh.outputs.current == 'true'
        env:
          STAGE_URL: ${{ steps.preview.outputs.stage_url }}
        run: |
          if [[ "$STAGE_URL" != "https://stage.notes.szolotov.com" ]]; then
            echo "::error::The stage Preview is not served at https://stage.notes.szolotov.com. notes.szolotov.com must be enabled for Production and Preview (applied by the first release, or in the dashboard). See docs/deployment.md#stage-preview."
            exit 1
          fi

      # Bot Fight Mode answers GitHub-hosted runners with 403 on the custom domains, so the
      # deploy is verified on the Preview's workers.dev URL. When the account protects Previews
      # with Cloudflare Access, that URL redirects to the Access login: SMOKE_ALLOW_ACCESS turns
      # that into a notice, and Wrangler reporting the stage URL above is the verification.
      # Set the repository or environment variable STAGE_SMOKE_TEST to "false" to skip entirely.
      - name: Smoke test (workers.dev)
        if: steps.fresh.outputs.current == 'true' && vars.STAGE_SMOKE_TEST != 'false'
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
          WORKERS_DEV_URL: ${{ steps.preview.outputs.workers_dev_url }}
          SMOKE_ALLOW_ACCESS: "1"
        run: |
          if [[ -z "$WORKERS_DEV_URL" ]]; then
            echo "::error::Wrangler reported no workers.dev URL for the Preview; enable preview_urls and workers_dev in wrangler.jsonc, or set STAGE_SMOKE_TEST to false."
            exit 1
          fi
          scripts/smoke-test.sh "$WORKERS_DEV_URL" "main+$SHA" noindex

      # Informational only: never fails the run.
      - name: Probe the custom domain
        if: steps.fresh.outputs.current == 'true'
        run: |
          code="$(curl --proto '=https' --tlsv1.2 -s -o /dev/null -w '%{http_code}' --max-time 30 \
            --user-agent 'notes-smoke-test/1 (+https://github.com/greenblacked/Notes)' \
            https://stage.notes.szolotov.com/ || true)"
          if [[ "$code" == "403" ]]; then
            echo "::notice::https://stage.notes.szolotov.com answered 403 to this runner (Cloudflare Bot Fight Mode); expected, verification used workers.dev."
          else
            echo "https://stage.notes.szolotov.com answered HTTP $code"
          fi

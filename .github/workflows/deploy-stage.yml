name: Deploy stage

# Every push to main is deployed to https://stage.notes.szolotov.com.
#
# Two jobs: `build` runs the (third-party plugin) build code with no secrets and
# no environment; `deploy` has the secrets, installs dependencies without
# lifecycle scripts, and only receives the build output as an artifact.
#
# Gating: instead of a workflow_run trigger (a dangerous trigger in zizmor), the
# checks run inline here against the exact commit being deployed.
on:
  push:
    branches: [main]

permissions: {}

# Runs queue (never cancel a deploy in flight); GitHub supersedes older pending
# runs, so only the newest queued commit waits.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # A cold `quartz plugin restore` (no cache here on purpose) takes about 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      current: ${{ steps.fresh.outputs.current }}
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check this commit is still the head of main
        id: fresh
        run: .github/scripts/is-main-head.sh

      - name: Set up Node.js
        if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      - name: Install dependencies
        if: steps.fresh.outputs.current == 'true'
        run: npm ci

      - name: Type check
        if: steps.fresh.outputs.current == 'true'
        run: npm run check

      - name: Build
        if: steps.fresh.outputs.current == 'true'
        env:
          NOTES_BASE_URL: stage.notes.szolotov.com
          NOTES_SHA: ${{ github.sha }}
        run: npm run build

      - name: Check links
        if: steps.fresh.outputs.current == 'true'
        run: npm run check:links

      - name: Upload build output
        if: steps.fresh.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            public
            worker/csp.generated.js
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to stage
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: staging
      url: https://stage.notes.szolotov.com
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      # No lifecycle scripts: nothing from the dependency tree runs next to the token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site

      - name: Deploy dry run
        run: npx wrangler deploy --env stage --dry-run --outdir "$RUNNER_TEMP/dry-run"

      - name: Re-check this commit is still the head of main
        id: fresh
        run: .github/scripts/is-main-head.sh

      - name: Deploy to Cloudflare (stage)
        if: steps.fresh.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env stage

      - name: Smoke test
        if: steps.fresh.outputs.current == 'true'
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: scripts/smoke-test.sh https://stage.notes.szolotov.com "main+$SHA" stage

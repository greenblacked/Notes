name: Release

# Cuts a vX.Y.Z tag and GitHub Release from the tip of main, then deploys it
# to production through the gated Deploy production workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create tag and release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are cut from main only (got $GITHUB_REF)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not X.Y.Z"
            exit 1
          fi

      - name: Create tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists"
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    # No secrets are passed: the called deploy job reads CLOUDFLARE_API_TOKEN
    # from the production environment, which only it can access.

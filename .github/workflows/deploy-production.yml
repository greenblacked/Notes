name: Deploy production

# Production starts only by workflow_dispatch on a vX.Y.Z tag ref: from Cut release
# (cut-release.yml), or Run workflow on a tag to redeploy or roll forward. Pushing a tag
# deploys nothing. Tag-only and the actor rule (the owner, or a Cut release run by the owner)
# are enforced here (the `guard` job): a private repository on GitHub Free has no environment
# rules, reviewers or rulesets.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Tag guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # look up the CI run for this commit
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out the helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Verify the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # SemVer core: no leading zeros (v01.2.3 is rejected).
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$REPO" != "greenblacked/Notes" ]]; then
            echo "::error::Unexpected repository '$REPO'."
            exit 1
          fi
          # The run itself must be on a release tag.
          if [[ "$REF" != "refs/tags/$REF_NAME" || ! "$REF_NAME" =~ $semver ]]; then
            echo "::error::Production deploys only run from release tags (vX.Y.Z); got $REF."
            exit 1
          fi
          tag="$REF_NAME"

          # Resolve the tag (annotated or lightweight) to its commit via the API.
          ref_obj="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object | "\(.type) \(.sha)"')"
          read -r obj_type obj_sha <<<"$ref_obj"
          if [[ "$obj_type" == "tag" ]]; then
            obj_sha="$(gh api "repos/$GH_REPO/git/tags/$obj_sha" --jq '.object.sha')"
          fi
          if [[ "$obj_sha" != "$SHA" ]]; then
            echo "::error::Tag $tag points at $obj_sha, not at $SHA. Refusing to deploy."
            exit 1
          fi
          echo "Tag $tag resolves to $SHA."
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      # No environment reviewers on a private Free repo: the owner deploys directly, or Cut
      # release (run by the owner) dispatches as github-actions[bot].
      - name: Require the owner or a Cut release by the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: .github/scripts/require-release-actor.sh

      # Whatever started the run (Cut release or a manual dispatch on a tag), the commit must have passed
      # CI on main and be on main: a tag on an unreviewed or failing commit is not deployed.
      - name: Require a successful CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: .github/scripts/require-ci-success.sh

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-24.04
    # A cold `quartz plugin restore` (no cache here on purpose) takes about 7 to 8 minutes measured on 4-core runners (2026-10-20), slower on 2-core.
    timeout-minutes: 45
    # Third-party plugin code runs here: no environment, no secrets.
    permissions:
      contents: read
    env:
      # Neither our dependencies nor the plugins' (npm-installed by `quartz plugin restore`) may
      # run install scripts next to this job's checkout; the build needs none of them.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NOTES_VERSION: ${{ needs.guard.outputs.version }}
          NOTES_SHA: ${{ github.sha }}
          NOTES_BASE_URL: notes.szolotov.com
        run: npm run build

      - name: Check links
        run: npm run check:links

      - name: Check the build output
        run: node scripts/check-artifact.mjs --public public

      # The artifact holds exactly public/ (worker/csp.generated.js is regenerated by the deploy
      # job from it, never taken from this job). Staged in a directory of its own so that the
      # upload keeps the `public/` prefix.
      - name: Stage the build output
        run: |
          mkdir "$RUNNER_TEMP/artifact"
          cp -R public "$RUNNER_TEMP/artifact/public"

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/artifact
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: [guard, build]
    runs-on: ubuntu-24.04
    # Room for approval-free deploy, smoke retries (about 2.5 minutes) and a rollback.
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: https://notes.szolotov.com
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      # Only wrangler, from tools/ (its own lockfile), with no lifecycle scripts. The root
      # dependencies are not installed here (defence in depth: a git dependency's `prepare`
      # script would run even with --ignore-scripts). Nothing but wrangler and the Node
      # built-ins runs next to the token (the scripts below import nothing else).
      - name: Install wrangler
        run: npm ci --ignore-scripts --prefix tools

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Only public/ is accepted from the artifact (built by a job that ran third-party code),
      # and it must pass the extension allowlist (scripts/check-artifact.mjs). The Worker's CSP
      # hashes are regenerated here from that public/, so no Worker code comes from the build.
      - name: Install build output
        run: |
          site="$RUNNER_TEMP/site"
          node scripts/check-artifact.mjs --root "$site"
          rm -rf public worker/csp.generated.js
          cp -R "$site/public" public
          node scripts/build-csp.mjs

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN and repository variable or secret CLOUDFLARE_ACCOUNT_ID must be set (Settings, Secrets and variables, Actions). Environment secrets are not available on a private repository on GitHub Free."
            exit 1
          fi

      # `wrangler deployments status --json` prints the active deployment as
      # {"versions":[{"version_id":...,"percentage":...}],...}; it errors when
      # the Worker has no deployment yet (first deploy), which is not fatal.
      - name: Record the live version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if out="$(tools/node_modules/.bin/wrangler deployments status --json 2>"$RUNNER_TEMP/previous.err")"; then
            id="$(jq -r 'if (.versions | length) == 1 then .versions[0].version_id else "" end' <<<"$out" || true)"
          else
            id=""
            echo "No previous deployment found (first deploy?):"
            cat "$RUNNER_TEMP/previous.err"
          fi
          if [[ -n "$id" ]]; then
            echo "Live version before deploy: $id"
          else
            echo "::notice::No single previous version recorded; automatic rollback is unavailable for this run."
          fi
          echo "version_id=$id" >>"$GITHUB_OUTPUT"

      # `wrangler deploy` also applies the routes (Custom Domain, previews_enabled).
      # Wrangler appends machine-readable entries to WRANGLER_OUTPUT_FILE_PATH.
      - name: Deploy to Cloudflare
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          tools/node_modules/.bin/wrangler deploy
          out="$(node scripts/read-wrangler-output.mjs --deploy "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "$out"
          echo "$out" >>"$GITHUB_OUTPUT"

      - name: Require the expected deploy targets
        env:
          CUSTOM_DOMAIN: ${{ steps.wrangler.outputs.custom_domain }}
          WORKERS_DEV_URL: ${{ steps.wrangler.outputs.workers_dev_url }}
        run: |
          if [[ "$CUSTOM_DOMAIN" != "yes" ]]; then
            echo "::error::Wrangler did not report notes.szolotov.com as a deploy target."
            exit 1
          fi
          if [[ -z "$WORKERS_DEV_URL" ]]; then
            echo "::error::Wrangler reported no workers.dev URL (workers_dev must be enabled in wrangler.jsonc)."
            exit 1
          fi

      # Verified on workers.dev: Cloudflare Bot Fight Mode answers GitHub-hosted runners with
      # 403 on the custom domain. workers.dev is not the canonical host, so it must be noindex.
      - name: Smoke test (workers.dev)
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
          WORKERS_DEV_URL: ${{ steps.wrangler.outputs.workers_dev_url }}
        run: scripts/smoke-test.sh "$WORKERS_DEV_URL" "$VERSION+$SHA" noindex

      - name: Verify the new version serves 100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.wrangler.outputs.version_id }}
        run: |
          out="$(tools/node_modules/.bin/wrangler deployments status --json)"
          echo "$out"
          if ! jq -e --arg id "$VERSION_ID" \
            '(.versions | length) == 1 and .versions[0].version_id == $id and .versions[0].percentage == 100' \
            <<<"$out" >/dev/null; then
            echo "::error::Version $VERSION_ID is not the only active version at 100%."
            exit 1
          fi

      # Informational only: never fails the run.
      - name: Probe the custom domain
        run: |
          code="$(curl --proto '=https' --tlsv1.2 -s -D "$RUNNER_TEMP/probe.h" -o /dev/null -w '%{http_code}' --max-time 30 \
            --user-agent 'notes-smoke-test/1 (+https://notes.szolotov.com)' \
            https://notes.szolotov.com/ || true)"
          if [[ "$code" == "403" ]]; then
            echo "::notice::https://notes.szolotov.com answered 403 to this runner (Cloudflare Bot Fight Mode); expected, verification used workers.dev."
          elif [[ "$code" == "200" ]] && grep -qi '^x-robots-tag:.*noindex' "$RUNNER_TEMP/probe.h"; then
            echo "::warning::https://notes.szolotov.com sends X-Robots-Tag noindex; the canonical host must be indexable."
          else
            echo "https://notes.szolotov.com answered HTTP $code"
          fi

      - name: Roll back to the previous version
        id: rollback
        if: (failure() || cancelled()) && steps.previous.outputs.version_id != '' && steps.wrangler.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: |
          # The failure may have happened before the new version went live.
          if out="$(tools/node_modules/.bin/wrangler deployments status --json)" && jq -e --arg id "$PREVIOUS_VERSION_ID" \
            '(.versions | length) == 1 and .versions[0].version_id == $id and .versions[0].percentage == 100' \
            <<<"$out" >/dev/null; then
            echo "::notice::Production still serves the previous version $PREVIOUS_VERSION_ID; no rollback needed."
            echo "rolled_back=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          tools/node_modules/.bin/wrangler rollback "$PREVIOUS_VERSION_ID" \
            --message "Automatic rollback after failed deploy of $TAG ($SHA)" --yes
          echo "rolled_back=true" >>"$GITHUB_OUTPUT"

      # Checked on workers.dev (Bot Fight Mode blocks the runner on the custom domain).
      - name: Check the site responds after rollback
        if: (failure() || cancelled()) && steps.rollback.outcome == 'success'
        env:
          WORKERS_DEV_URL: ${{ steps.wrangler.outputs.workers_dev_url }}
          ROLLED_BACK: ${{ steps.rollback.outputs.rolled_back }}
        run: |
          if [[ -n "$WORKERS_DEV_URL" ]]; then
            curl --proto '=https' --tlsv1.2 -fsS --retry 5 --retry-delay 5 --retry-all-errors \
              --max-time 30 -o /dev/null "$WORKERS_DEV_URL/"
          else
            echo "::warning::No workers.dev URL was recorded; the site was not probed afterwards."
          fi
          if [[ "$ROLLED_BACK" == "true" ]]; then
            echo "::error::Deploy of $TAG failed and was rolled back; the site is serving the previous version."
          else
            echo "::error::Deploy of $TAG failed before it went live; the site still serves the previous version."
          fi
          exit 1

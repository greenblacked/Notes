name: Repository settings

# Manual only: applies the branch rulesets and environment branch policies this pipeline relies
# on (docs/deployment.md#repository-settings), idempotently. Runs only from main, only for the
# owner, in the environment `repo-admin` (deployment branches: main), with the secret
# REPO_ADMIN_TOKEN (fine-grained PAT, this repository only). dry_run (default) only prints
# the planned changes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the planned changes"
        type: boolean
        required: true
        default: true
      delete_old_environments:
        description: "Also delete the retired GitHub environments dev and staging (irreversible; only after Deploy stage succeeded)"
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: repo-settings
  cancel-in-progress: false

jobs:
  guard:
    name: Require main and the owner
    if: github.repository == 'greenblacked/Notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Require main and the owner
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Repository settings runs only from main (got '$REF')."; exit 1
          fi
          if [[ "$ACTOR" != "greenblacked" || "$TRIGGERING_ACTOR" != "greenblacked" ]]; then
            echo "::error::Repository settings is limited to the owner."; exit 1
          fi

  apply:
    name: Apply settings
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: repo-admin
    steps:
      - name: Check out the helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Apply repository settings
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELETE_OLD_ENVIRONMENTS: ${{ inputs.delete_old_environments }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret REPO_ADMIN_TOKEN is not set in the environment repo-admin (see docs/deployment.md#repository-settings)."
            exit 1
          fi
          .github/scripts/repo-settings.sh

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-check:
    name: Build and check
    runs-on: ubuntu-24.04
    # A cold `quartz plugin restore` takes about 7 to 8 minutes measured on 4-core runners (2026-10-20), slower on 2-core.
    # Kept under the 25 minutes the browser shards wait for this job, so a hung build ends before they give up.
    timeout-minutes: 24
    permissions:
      contents: read
    env:
      # Same as the deploy builds: no install scripts from our dependencies or the plugins'.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Plugins are cloned at the commits in quartz.lock.json. No restore-keys: a
      # changed lock file never reuses stale plugin directories (restore skips
      # directories that already exist).
      - name: Cache Quartz plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ runner.os }}-${{ hashFiles('quartz.lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Check note metadata and print the review queue
        run: npm run check:notes -- --summary "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check:links

      - name: Check the build output
        run: node scripts/check-artifact.mjs --public public

      # The browser tests run in their own job against exactly this build output.
      - name: Collect the build output for the browser tests
        run: |
          mkdir "$RUNNER_TEMP/artifact"
          cp -R public "$RUNNER_TEMP/artifact/public"

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-site
          path: ${{ runner.temp }}/artifact
          retention-days: 1
          if-no-files-found: error

      - name: Test scripts and Worker policy
        run: npm run test:scripts

      - name: Check colour contrast (WCAG AA)
        run: npm run check:contrast

      - name: Deploy dry run (no credentials)
        run: npm run deploy:dry-run

  # One job per (Playwright project, shard). Shards start with the build job and wait for it
  # (step "Wait for the build job"), so that the wall-clock time is about the slower of the
  # build and a shard's setup, plus the slowest shard's tests, not the sum of four projects. Every job bills at least one whole minute (and each is
  # rounded up on its own), so the shard count trades wall-clock against billed minutes: see
  # "CI minutes" in docs/deployment.md. The shard count is this list; each project's shards
  # must be exactly 1/N to N/N (checked by scripts/workflows.test.mjs).
  browser:
    name: Browser ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      # Read this run's job list (the wait step).
      actions: read
    strategy:
      # Every shard runs even if one fails, so a flaky shard can be re-run alone (Re-run failed
      # jobs would otherwise re-run all cancelled shards too). CI OK still needs every shard.
      fail-fast: false
      matrix:
        include:
          - {
              id: chromium-desktop-1,
              project: chromium-desktop,
              browser: chromium,
              shard: 1/3,
              format: true,
            }
          - { id: chromium-desktop-2, project: chromium-desktop, browser: chromium, shard: 2/3 }
          - { id: chromium-desktop-3, project: chromium-desktop, browser: chromium, shard: 3/3 }
          - { id: chromium-phone-1, project: chromium-phone, browser: chromium, shard: 1/3 }
          - { id: chromium-phone-2, project: chromium-phone, browser: chromium, shard: 2/3 }
          - { id: chromium-phone-3, project: chromium-phone, browser: chromium, shard: 3/3 }
          - { id: webkit-desktop-1, project: webkit-desktop, browser: webkit, shard: 1/3 }
          - { id: webkit-desktop-2, project: webkit-desktop, browser: webkit, shard: 2/3 }
          - { id: webkit-desktop-3, project: webkit-desktop, browser: webkit, shard: 3/3 }
          - { id: webkit-phone-1, project: webkit-phone, browser: webkit, shard: 1/3 }
          - { id: webkit-phone-2, project: webkit-phone, browser: webkit, shard: 2/3 }
          - { id: webkit-phone-3, project: webkit-phone, browser: webkit, shard: 3/3 }
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      PROJECT: ${{ matrix.project }}
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check the browser tests
        run: npm run check:browser

      # Runs in one shard only; .prettierignore excludes the build output, so it does not need it.
      - name: Check formatting
        if: matrix.format
        run: npm run format:check

      # The browser versions come from the Playwright version in package-lock.json.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./node_modules/playwright-core/package.json").version')" >>"$GITHUB_OUTPUT"

      # PR runs write PR-scoped caches only; main runs read main-scoped ones. No restore-keys: a
      # new Playwright version never reuses old browsers. One cache per browser, so a job
      # downloads only the browser it uses (two shards racing to save only get a warning).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps "$BROWSER"

      # The browsers come from the cache; the system packages they need are not cached.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps "$BROWSER"

      # The shards start with the build instead of after it, so that their setup (npm ci,
      # browsers, system packages) overlaps the build. This waits for the latest attempt of the
      # build job and fails as soon as that attempt fails, so a broken build never leaves the
      # shards waiting. A re-run of only the failed shards finds the earlier successful attempt.
      - name: Wait for the build job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          start=$SECONDS
          failures=0
          while :; do
            if latest="$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Build and check") | "\(.run_attempt) \(.status) \(.conclusion)"' |
              sort -n | tail -n 1)"; then
              failures=0
              read -r attempt status conclusion <<<"${latest:-0 missing none}"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Build and check (attempt $attempt) succeeded."
                  exit 0
                fi
                echo "::error::Build and check (attempt $attempt) ended with '$conclusion'; there is no build output to test."
                exit 1
              fi
            else
              failures=$((failures + 1))
              echo "::warning::Could not read the job list ($failures in a row); retrying."
              if ((failures >= 10)); then
                echo "::error::The job list stayed unreadable (API error or rate limit); giving up."
                exit 1
              fi
            fi
            elapsed=$((SECONDS - start))
            if ((elapsed >= 1500)); then
              echo "::error::Timed out after $elapsed s waiting for Build and check."
              exit 1
            fi
            # Poll often while a warm build is due, then slowly (a cold plugin restore takes minutes),
            # which keeps 12 shards well under the token's API rate limit.
            if ((elapsed < 90)); then sleep 5; elif ((elapsed < 300)); then sleep 15; else sleep 30; fi
          done

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-site
          path: ${{ runner.temp }}/site

      # The same checks as the deploy jobs: only a valid public/ is used, and the Worker's CSP
      # hashes are regenerated from it.
      - name: Install build output
        run: |
          site="$RUNNER_TEMP/site"
          node scripts/check-artifact.mjs --root "$site"
          rm -rf public worker/csp.generated.js
          cp -R "$site/public" public
          node scripts/build-csp.mjs

      - name: Run the browser smoke tests
        run: |
          [[ "$PROJECT" =~ ^[a-z]+-[a-z]+$ && "$SHARD" =~ ^[1-9]/[1-9]$ ]] || exit 1
          npm run test:browser -- --project="$PROJECT" --shard="$SHARD"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    name: Lint workflows and check attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the PR's current title and body. Accepted trade-off of merging the two checks:
      # the token zizmor gets has this scope too (it adds only PR text to contents: read).
      pull-requests: read
    env:
      # actionlint: release binary, verified against the sha256 published in the
      # release's checksums file (rhysd/actionlint v1.7.12, linux_amd64).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # Full history so that the range of the pull request or push can be listed.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A text/ branch ships to production without stage (text-release.yml), so its pull request
      # may change only notes under content/. The gate scripts run from the pull request's base
      # commit, never from its head: a text/ pull request cannot rewrite the check that judges it.
      # It runs right after the checkout, before any step that executes the pull request's code
      # (that code could otherwise shadow git or tar, or plant replace refs, to forge the extract).
      # Every other check still runs on it.
      - name: Require only content changes on a text/ branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -Eeuo pipefail
          if [[ "${EVENT_NAME:-}" != "pull_request" || "${HEAD_REF:-}" != text/* ]]; then
            echo "Not a text/ pull request; no path restriction."
            exit 0
          fi
          if [[ ! "$PR_BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            echo "::error::The base commit '$PR_BASE' is not in this checkout; refusing to judge a text/ pull request."
            exit 1
          fi
          for f in require-text-paths.sh require-content-only.sh; do
            mode="" type=""
            read -r mode type _ < <(git ls-tree "$PR_BASE" -- ".github/scripts/$f") || true
            if [[ "$mode" != "100755" || "$type" != "blob" ]]; then
              echo "::error::The base commit $PR_BASE has no executable .github/scripts/$f; a text/ pull request needs the gate on its base branch first."
              exit 1
            fi
          done
          trusted="$RUNNER_TEMP/trusted-base"
          mkdir "$trusted"
          git archive --format=tar "$PR_BASE" .github/scripts | tar -x -f - -C "$trusted"
          "$trusted/.github/scripts/require-text-paths.sh"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Commit messages, author and committer emails, and for a pull request its title and body
      # (fetched when the step runs, not taken from the event payload, which keeps the body as it
      # was when the run started: a footer appended at creation and cleaned afterwards is gone
      # on a re-run) must carry no tooling attribution. A zero `before`
      # (first push) checks only the head commit. Runs before any downloaded tool.
      - name: Require no tooling attribution
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq '{pull_request: .}' >"$RUNNER_TEMP/pr.json"
            node scripts/check-attribution.mjs --range "$PR_BASE..$PR_HEAD" --event "$RUNNER_TEMP/pr.json"
          else
            node scripts/check-attribution.mjs --range "$PUSH_BEFORE..$PUSH_AFTER"
          fi

      - name: Install actionlint
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/actionlint" actionlint

      # The runner image ships shellcheck, which actionlint uses for run: blocks.
      - name: Run actionlint
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color

      - name: Run shellcheck on scripts
        run: shellcheck scripts/smoke-test.sh .github/scripts/*.sh

      # zizmor is installed from PyPI with a pinned version and sha256 hash
      # (.github/requirements/zizmor.txt) instead of the zizmor-action, which
      # keeps the whole toolchain reproducible and avoids another third-party action.
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --require-hashes --only-binary :all: \
            -r .github/requirements/zizmor.txt

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor-venv/bin/zizmor" --format=github .github'

  ci-ok:
    name: CI OK
    if: always()
    needs: [build-and-check, browser, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # look up the PR's current head commit
    steps:
      # Cancelled jobs fail this check, except when the run was cancelled because a
      # newer commit superseded it on the PR: that commit is no longer the PR head,
      # so its result never gates a merge. A cancelled run on the current head still
      # fails (a skipped required check would count as passing).
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Job results: $RESULTS"
          if jq -e 'all(. == "success")' <<<"$RESULTS" >/dev/null; then
            echo "All CI jobs succeeded."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]] &&
            jq -e 'all(. == "success" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
            if [[ -n "$head" && "$head" != "$RUN_SHA" ]]; then
              echo "::notice::Run superseded by $head on the PR; $RUN_SHA no longer gates the merge."
              exit 0
            fi
          fi
          echo "::error::At least one CI job did not succeed."
          exit 1

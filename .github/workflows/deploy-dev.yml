name: Deploy dev

# Manual only: updates the Worker Preview `dev` of the Worker `notes`, served at
# https://dev.notes.szolotov.com (see docs/deployment.md#dev-preview). Run it from the Actions
# tab (Deploy dev, Run workflow, branch `main`, action `deploy`) when the owner asks for it.
# There is no push trigger, so dev may lag behind main by design. Production is not touched:
# Previews never change production traffic.
#
# The `guard` job fails every run that was not started from main, so the jobs that hold the
# Cloudflare token only ever run main's code (the environment `dev` is limited to main too).
#
# Two actions:
#   deploy        build main with no secrets, then upload it to the Preview `dev`.
#   remove-stage  one time: delete the Preview `stage` left over from the old stage environment.
#                 Deleting a Preview that is already gone is not an error, so re-running is harmless.
#
# Two jobs for `deploy`: `build` runs the (third-party plugin) build code with no secrets and
# no environment; `upload` has the secrets, installs only wrangler (tools/, without
# lifecycle scripts) and receives only public/ from the build as an artifact; the Worker
# code is never taken from it.
#
# Gating: instead of a workflow_run trigger (a dangerous trigger in zizmor), the
# checks run inline here against the exact commit being deployed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do (run from main)"
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - remove-stage

permissions: {}

# Runs queue (never cancel a deploy in flight); GitHub supersedes older pending
# runs, so only the newest queued one waits.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REF: ${{ github.ref }}
    steps:
      - name: Require the main branch
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Deploy dev runs only from main; select main in Run workflow (this run was started from '$REF')."
            exit 1
          fi

  build:
    name: Build
    needs: guard
    if: inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    # A cold `quartz plugin restore` (no cache here on purpose) takes about 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      current: ${{ steps.fresh.outputs.current }}
    env:
      SHA: ${{ github.sha }}
      # Neither our dependencies nor the plugins' (npm-installed by `quartz plugin restore`) may
      # run install scripts next to this job's checkout; the build needs none of them.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check this commit is still the head of main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/is-main-head.sh

      - name: Set up Node.js
        if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      - name: Install dependencies
        if: steps.fresh.outputs.current == 'true'
        run: npm ci

      - name: Type check
        if: steps.fresh.outputs.current == 'true'
        run: npm run check

      - name: Build
        if: steps.fresh.outputs.current == 'true'
        env:
          NOTES_BASE_URL: dev.notes.szolotov.com
          NOTES_SHA: ${{ github.sha }}
        run: npm run build

      - name: Check links
        if: steps.fresh.outputs.current == 'true'
        run: npm run check:links

      - name: Check the build output
        if: steps.fresh.outputs.current == 'true'
        run: node scripts/check-artifact.mjs --public public

      # The artifact holds exactly public/ (worker/csp.generated.js is regenerated by the deploy
      # job from it, never taken from this job). Collected in a directory of its own so that the
      # upload keeps the `public/` prefix.
      - name: Collect the build output
        if: steps.fresh.outputs.current == 'true'
        run: |
          mkdir "$RUNNER_TEMP/artifact"
          cp -R public "$RUNNER_TEMP/artifact/public"

      - name: Upload build output
        if: steps.fresh.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/artifact
          retention-days: 1
          if-no-files-found: error

  upload:
    name: Update dev Preview
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: dev
      url: https://dev.notes.szolotov.com
    env:
      SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      # The guard job ensures github.sha is a commit of main, so this is trusted code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      # Only wrangler, from tools/ (its own lockfile), with no lifecycle scripts. The root
      # dependencies are not installed here: two of them are git dependencies with a `prepare`
      # script, which npm runs even with --ignore-scripts. Nothing but wrangler and the Node
      # built-ins runs next to the token (the scripts below import nothing else).
      - name: Install wrangler
        run: npm ci --ignore-scripts --prefix tools

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Only public/ is accepted from the artifact (built by a job that ran third-party code),
      # and it must pass the extension allowlist (scripts/check-artifact.mjs). The Worker's CSP
      # hashes are regenerated here from that public/, so no Worker code comes from the build.
      - name: Install build output
        run: |
          site="$RUNNER_TEMP/site"
          node scripts/check-artifact.mjs --root "$site"
          rm -rf public worker/csp.generated.js
          cp -R "$site/public" public
          node scripts/build-csp.mjs

      - name: Re-check this commit is still the head of main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/is-main-head.sh

      # `wrangler preview` creates or updates the Preview `dev`; its ENVIRONMENT var comes from
      # `previews.vars` in wrangler.jsonc (not production, so noindex). It does not touch
      # production or the routes.
      - name: Update the dev Preview
        id: preview
        if: steps.fresh.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview.ndjson
        run: |
          tools/node_modules/.bin/wrangler preview --name dev --message "dev ${SHA::7}" --tag "$SHA"
          out="$(node scripts/read-wrangler-output.mjs --preview "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "$out"
          echo "$out" >>"$GITHUB_OUTPUT"

      - name: Require the custom domain Preview URL
        if: steps.fresh.outputs.current == 'true'
        env:
          DEV_URL: ${{ steps.preview.outputs.custom_url }}
        run: |
          if [[ "$DEV_URL" != "https://dev.notes.szolotov.com" ]]; then
            echo "::error::The dev Preview is not served at https://dev.notes.szolotov.com (Wrangler reported '$DEV_URL'). notes.szolotov.com must be enabled for Production and Preview. See docs/deployment.md#dev-preview."
            exit 1
          fi
          echo "::notice::Dev preview: https://dev.notes.szolotov.com"
          {
            echo "### Dev preview"
            echo
            echo "https://dev.notes.szolotov.com (commit \`${SHA::7}\`)"
          } >>"$GITHUB_STEP_SUMMARY"

      # Bot Fight Mode answers GitHub-hosted runners with 403 on the custom domains, so the
      # deploy is verified on the Preview's workers.dev URL. When the account protects Previews
      # with Cloudflare Access, that URL redirects to the Access login: SMOKE_ALLOW_ACCESS turns
      # that into a notice, and Wrangler reporting the custom domain URL above is the
      # verification. Set the repository or environment variable DEV_SMOKE_TEST to "false" to
      # skip it entirely.
      - name: Smoke test (workers.dev)
        if: steps.fresh.outputs.current == 'true' && vars.DEV_SMOKE_TEST != 'false'
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
          WORKERS_DEV_URL: ${{ steps.preview.outputs.workers_dev_url }}
          SMOKE_ALLOW_ACCESS: "1"
        run: |
          if [[ -z "$WORKERS_DEV_URL" ]]; then
            echo "::error::Wrangler reported no workers.dev URL for the Preview; enable preview_urls and workers_dev in wrangler.jsonc, or set DEV_SMOKE_TEST to false."
            exit 1
          fi
          scripts/smoke-test.sh "$WORKERS_DEV_URL" "main+$SHA" noindex

      # Informational only: never fails the run.
      - name: Probe the custom domain
        if: steps.fresh.outputs.current == 'true'
        run: |
          code="$(curl --proto '=https' --tlsv1.2 -s -o /dev/null -w '%{http_code}' --max-time 30 \
            --user-agent 'notes-smoke-test/1 (+https://github.com/greenblacked/Notes)' \
            https://dev.notes.szolotov.com/ || true)"
          if [[ "$code" == "403" ]]; then
            echo "::notice::https://dev.notes.szolotov.com answered 403 to this runner (Cloudflare Bot Fight Mode); expected, verification used workers.dev."
          else
            echo "https://dev.notes.szolotov.com answered HTTP $code"
          fi

  remove-stage:
    name: Remove stage Preview
    needs: guard
    if: inputs.action == 'remove-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: dev
      url: https://dev.notes.szolotov.com
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no npm cache outside CI (cache-poisoning)

      # Only wrangler, from tools/ (its own lockfile), with no lifecycle scripts.
      - name: Install wrangler
        run: npm ci --ignore-scripts --prefix tools

      # One time clean-up of the Preview `stage` of the old stage environment. Re-running is
      # harmless: when Cloudflare answers that the Preview does not exist, that is the wanted
      # end state and the step passes with a notice. Any other failure (bad token, network)
      # still fails the step. Wrangler reports the API error text, so "not found" is matched on
      # the combined output; the exact wording of the API error is not documented.
      - name: Delete the stage Preview
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if out="$(tools/node_modules/.bin/wrangler preview delete --name stage --skip-confirmation 2>&1)"; then
            echo "$out"
            echo "result=deleted" >>"$GITHUB_OUTPUT"
          else
            echo "$out"
            if grep -qi "not found" <<<"$out"; then
              echo "::notice::The stage Preview does not exist (already removed); nothing to do."
              echo "result=absent" >>"$GITHUB_OUTPUT"
            else
              echo "::error::Deleting the stage Preview failed; see the output above."
              exit 1
            fi
          fi

      - name: Summary
        env:
          RESULT: ${{ steps.delete.outputs.result }}
        run: |
          {
            echo "### Remove stage"
            echo
            if [[ "$RESULT" == "deleted" ]]; then
              echo "The Preview \`stage\` of the Worker \`notes\` was deleted."
            else
              echo "The Preview \`stage\` did not exist; nothing to delete."
            fi
            echo
            echo "This action is only needed once. Production and the \`dev\` Preview are not touched."
          } >>"$GITHUB_STEP_SUMMARY"

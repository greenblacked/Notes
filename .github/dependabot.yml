# Version updates target dev (the integration branch). GitHub security updates always target the
# default branch (main); merge those as usual or retarget them to dev.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Quartz plugins in .quartz/plugins install their own @types/hast (pinned by their
      # lockfiles). A root version that differs makes the two hast types incompatible and fails
      # `npm run check` (see #18). Bump it by hand together with the plugins.
      - dependency-name: "@types/hast"
    labels: [dependencies]

  # Wrangler for the deploy jobs (tools/ has its own lockfile; see docs/deployment.md). Keep it
  # in step with the wrangler version in the root package.json.
  - package-ecosystem: npm
    directory: /tools
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /.github/requirements
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]

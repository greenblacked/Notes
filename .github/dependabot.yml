# Version and security updates target the default branch (main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Quartz plugins in .quartz/plugins install their own @types/hast (pinned by their
      # lockfiles). A root version that differs makes the two hast types incompatible and fails
      # `npm run check` (see #18). Bump it by hand together with the plugins.
      - dependency-name: "@types/hast"
      # The Quartz packages peer-depend on preact ^10 (@quartz-community/utils), so a preact 11
      # bump fails `npm ci` with ERESOLVE. Minor and patch updates still come. Move to the next
      # major by hand together with Quartz.
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  # Wrangler for the deploy jobs (tools/ has its own lockfile; see docs/deployment.md). Keep it
  # in step with the wrangler version in the root package.json.
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]
